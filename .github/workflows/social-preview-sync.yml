name: Social preview sync

on:
  push:
    branches:
      - v1-concept
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-social-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V1
        uses: actions/checkout@v4
        with:
          ref: v1-concept
          fetch-depth: 0

      - name: Inject Open Graph metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          pattern = r'(?m)^\s*<meta property="og:title".*\n\s*<meta property="og:description".*\n\s*<meta property="og:type".*$'
          new = '''  <meta property="og:title" content="Atacadão Valinhos | Limpeza, Descartáveis e Utilidades" />
          <meta property="og:description" content="Soluções para casa, empresas e food service. Duas unidades em Valinhos." />
          <meta property="og:type" content="website" />
          <meta property="og:url" content="https://olegariotech-site.github.io/atacadao-valinhos/" />
          <meta property="og:image" content="https://olegariotech-site.github.io/atacadao-valinhos/assets/media/social/og-atacadao-valinhos.png" />
          <meta property="og:image:alt" content="Atacadão Valinhos — limpeza, descartáveis e utilidades para casa, empresas e food service" />
          <meta name="twitter:card" content="summary_large_image" />
          <meta name="twitter:title" content="Atacadão Valinhos | Limpeza, Descartáveis e Utilidades" />
          <meta name="twitter:description" content="Soluções para casa, empresas e food service. Duas unidades em Valinhos." />
          <meta name="twitter:image" content="https://olegariotech-site.github.io/atacadao-valinhos/assets/media/social/og-atacadao-valinhos.png" />'''

          if 'og-atacadao-valinhos.png' in html:
              print('Open Graph metadata already present.')
          else:
              updated, count = re.subn(pattern, new, html, count=1)
              if count != 1:
                  raise SystemExit(f'Expected 1 OG block, replaced {count}')
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit metadata to V1
        shell: bash
        run: |
          git config user.name "Olegario Tech"
          git config user.email "olegariotech.oficial@gmail.com"
          if git diff --quiet; then
            echo "No metadata changes required."
          else
            git add index.html
            git commit -m "feat: add WhatsApp social preview metadata [skip ci]"
            git push origin HEAD:v1-concept
          fi

      - name: Publish V1 to gh-pages
        shell: bash
        run: |
          git push origin HEAD:gh-pages --force
